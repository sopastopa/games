<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="theme-color" content="#0b1220" />
    <meta
      name="description"
      content="Snake : un jeu d'arcade jouable dans le navigateur."
    />
    <title>Snake · Games</title>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="back" href="../../" data-testid="back-home">← Tous les jeux</a
        ><span class="brand">◈ GAMES</span>
      </header>
      <main class="game-layout">
        <section class="game-intro">
          <p class="eyebrow">01 / ARCADE CLASSIQUE</p>
          <h1>Snake<span>.</span></h1>
          <p>Mange les pommes. Grandis. Ne te mords pas la queue.</p>
          <div class="scoreboard">
            <div class="score-item">
              <span>SCORE</span
              ><strong id="score" data-testid="score">0</strong>
            </div>
            <div class="score-item">
              <span>RECORD</span><strong id="best-score">0</strong>
            </div>
          </div>
          <p class="instructions">
            Flèches ou WASD pour diriger · Espace pour pause/reprise
          </p>
        </section>
        <section class="game-area" aria-label="Plateau de Snake">
          <div class="board-frame">
            <canvas
              id="board"
              width="512"
              height="512"
              role="img"
              aria-label="Grille de Snake de 16 par 16 cases"
            ></canvas>
          </div>
          <div class="status-bar">
            <span class="status-dot" aria-hidden="true"></span
            ><span id="game-status" data-testid="game-status" role="status"
              >Prêt à jouer</span
            >
          </div>
          <div class="actions">
            <button id="start" class="primary" type="button">Démarrer</button
            ><button id="pause" type="button" disabled>Pause</button
            ><button id="restart" type="button">Recommencer</button>
          </div>
          <div class="direction-pad" aria-label="Commandes tactiles">
            <button type="button" data-direction="up" aria-label="Haut">
              ↑
            </button>
            <div class="direction-row">
              <button type="button" data-direction="left" aria-label="Gauche">
                ←</button
              ><button type="button" data-direction="down" aria-label="Bas">
                ↓</button
              ><button type="button" data-direction="right" aria-label="Droite">
                →
              </button>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/presentation/main.ts"></script>
  </body>
</html>
