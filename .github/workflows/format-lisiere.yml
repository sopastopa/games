name: Format LISIERE sources

on:
  push:
    branches: [feat/lisiere-strategy]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: format-lisiere
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/lisiere-strategy
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write games/lisiere tests/e2e/lisiere.spec.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/lisiere tests/e2e/lisiere.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(lisiere): format new strategy game"
            git push origin HEAD:feat/lisiere-strategy
          fi
