name: TORSION formatting (temporary)

on:
  push:
    branches: [feat/torsion-rotation-puzzle]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply repository Prettier rules
        run: pnpm exec prettier --write games/torsion tests/e2e/torsion.spec.ts
      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/torsion tests/e2e/torsion.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(torsion): apply repository formatting"
            git push
          fi
