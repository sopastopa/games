name: Editorial site formatting (temporary)

on:
  push:
    branches: [feat/editorial-light-site-redesign]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply repository formatting
        run: pnpm exec prettier --write apps/portal docs/DESIGN_SYSTEM.md games/snake/src/presentation/style.css games/les-absents/src/presentation/style.css games/pulse/src/presentation/style.css games/rebond/src/presentation/style.css games/lisiere/src/presentation/style.css games/torsion/src/presentation/style.css games/nuage/src/presentation/style.css tests/e2e/portal-design.spec.ts
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/portal docs/DESIGN_SYSTEM.md games/snake/src/presentation/style.css games/les-absents/src/presentation/style.css games/pulse/src/presentation/style.css games/rebond/src/presentation/style.css games/lisiere/src/presentation/style.css games/torsion/src/presentation/style.css games/nuage/src/presentation/style.css tests/e2e/portal-design.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(site): apply shared formatting conventions"
            git push
          fi
