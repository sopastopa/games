name: Format REBOND sources

on:
  push:
    branches: [feat/rebond]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: format-rebond
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rebond
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write games/rebond tests/e2e/rebond.spec.ts
      - name: Commit normalized formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/rebond tests/e2e/rebond.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(rebond): normalize formatting"
            git push origin HEAD:feat/rebond
          fi
