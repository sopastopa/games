name: Temporary PRISME expeditions formatting

on:
  push:
    branches: [feat/prisme-expeditions-tactiques]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prisme-expeditions-tactiques
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write games/prisme tests/e2e/prisme.spec.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/prisme tests/e2e/prisme.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(prisme): format expedition sources"
            git push
          fi
