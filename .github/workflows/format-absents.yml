name: Format Les Absents branch

on:
  push:
    branches: [feat/les-absents]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: format-les-absents
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/les-absents
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format new game and tests
        run: pnpm exec prettier --write games/les-absents tests/e2e/les-absents.spec.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/les-absents tests/e2e/les-absents.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format Les Absents"
            git push origin HEAD:feat/les-absents
          fi
