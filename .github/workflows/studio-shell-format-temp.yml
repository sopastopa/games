name: Studio shell formatting (temporary)

on:
  push:
    branches: [feat/studio-visual-redesign]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Normalize studio shell files
        run: pnpm exec prettier --write apps/portal/public/studio.css games/*/index.html tests/e2e/studio-design.spec.ts docs/DESIGN_SYSTEM.md docs/GAME_STANDARDS.md
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/portal/public/studio.css games/*/index.html tests/e2e/studio-design.spec.ts docs/DESIGN_SYSTEM.md docs/GAME_STANDARDS.md
          if ! git diff --cached --quiet; then
            git commit -m "style: format shared game studio shell"
            git push
          fi
