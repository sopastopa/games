name: NUAGE temporary format

on:
  push:
    branches: [feat/nuage-narrative-runner]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply repository Prettier conventions
        run: pnpm exec prettier --write games/nuage tests/e2e/nuage.spec.ts
      - name: Commit normalized formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/nuage tests/e2e/nuage.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(nuage): apply repository Prettier conventions"
            git push
          fi
